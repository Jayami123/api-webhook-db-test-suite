# Medusa store contract SUBSET, written by the medusa lane (not a served or upstream document).
#
# Why: the pinned product serves no OpenAPI document (probe P-MED-15, 2026-11-02, 404 on every path
# tried), the installed packages ship none, and the upstream repository is outside this session's
# repository scope. Decision D6 in the lane PR body: the owner confirms this subset as the contract.
#
# Source of every field: the response bodies observed on the pinned product
#   product: Medusa 2.21.2 at fork f677db438f27294fc50e4c7c6612e71ff38eeff5
#   harness: qa-portfolio-harness 0.3.1 (MEDUSA_REDIS=1 MEDUSA_STRIPE=1 MEDUSA_FF_CACHING=true)
#   date:    2026-11-02 (probe record docs/probes/2026-11-02-p2-medusa-l0-probes.md)
#
# Scope: the store routes the lane calls, and the GET list routes that answer 200 with valid
# parameters on that stack. Only the keys the lane depends on are required. additionalProperties is
# not set to false anywhere: the product adds fields and the contract does not forbid them.
openapi: 3.0.3
info:
  title: Medusa store (lane subset)
  version: "2.21.2"
  description: Lane-authored subset of the store API, observed on Medusa 2.21.2 (see the header comment).
servers:
  - url: http://127.0.0.1:9000
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        type:
          type: string
        message:
          type: string
    Money:
      type: number
    Region:
      type: object
      required: [id, name, currency_code]
      properties:
        id:
          type: string
        name:
          type: string
        currency_code:
          type: string
    Cart:
      type: object
      required: [id, region_id, currency_code, email, item_total, subtotal, total, items]
      properties:
        id:
          type: string
        region_id:
          type: string
        currency_code:
          type: string
        email:
          type: string
        completed_at: {}
        item_total:
          $ref: "#/components/schemas/Money"
        subtotal:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            type: object
        region:
          $ref: "#/components/schemas/Region"
    CartEnvelope:
      type: object
      required: [cart]
      properties:
        cart:
          $ref: "#/components/schemas/Cart"
    PaymentSession:
      type: object
      required: [id, provider_id]
      properties:
        id:
          type: string
        provider_id:
          type: string
    PaymentCollection:
      type: object
      required: [id, currency_code, amount, payment_sessions]
      properties:
        id:
          type: string
        currency_code:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        payment_sessions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentSession"
    PaymentCollectionEnvelope:
      type: object
      required: [payment_collection]
      properties:
        payment_collection:
          $ref: "#/components/schemas/PaymentCollection"
    CompleteResponse:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [order, cart]
        order:
          type: object
          required: [id, currency_code]
          properties:
            id:
              type: string
            currency_code:
              type: string
    ListEnvelope:
      type: object
      required: [count, limit, offset]
      properties:
        count:
          type: number
        limit:
          type: number
        offset:
          type: number
paths:
  /store/carts:
    post:
      operationId: createCart
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Cart created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
  /store/carts/{id}:
    get:
      operationId: getCart
      security: [{ publishableKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /store/carts/{id}/line-items:
    post:
      operationId: addLineItem
      security: [{ publishableKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cart with the new line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          description: Invalid variant, or invalid quantity (for example "Variants … do not exist")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /store/payment-collections:
    post:
      operationId: createPaymentCollection
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Payment collection for the cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCollectionEnvelope"
  /store/payment-collections/{id}/payment-sessions:
    post:
      operationId: createPaymentSession
      security: [{ publishableKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Collection with its sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCollectionEnvelope"
  /store/carts/{id}/complete:
    post:
      operationId: completeCart
      security: [{ publishableKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order created (type order)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteResponse"
        "400":
          description: Refused (for example not_allowed on stock, or an already completed cart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /store/regions:
    get:
      operationId: listRegions
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [regions]
                    properties:
                      regions:
                        type: array
                        items:
                          $ref: "#/components/schemas/Region"
  /store/products:
    get:
      operationId: listProducts
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [products]
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          required: [id, title]
                          properties:
                            id:
                              type: string
                            title:
                              type: string
  /store/product-categories:
    get:
      operationId: listProductCategories
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Product categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [product_categories]
                    properties:
                      product_categories:
                        type: array
  /store/collections:
    get:
      operationId: listCollections
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [collections]
                    properties:
                      collections:
                        type: array
  /store/product-tags:
    get:
      operationId: listProductTags
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Product tags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [product_tags]
                    properties:
                      product_tags:
                        type: array
  /store/product-types:
    get:
      operationId: listProductTypes
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Product types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [product_types]
                    properties:
                      product_types:
                        type: array
  /store/currencies:
    get:
      operationId: listCurrencies
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Currencies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [currencies]
                    properties:
                      currencies:
                        type: array
  /store/return-reasons:
    get:
      operationId: listReturnReasons
      security: [{ publishableKey: [] }]
      responses:
        "200":
          description: Return reasons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [return_reasons]
                    properties:
                      return_reasons:
                        type: array
  /store/payment-providers:
    get:
      operationId: listPaymentProviders
      security: [{ publishableKey: [] }]
      parameters:
        - { name: region_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Payment providers for the region
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    required: [payment_providers]
                    properties:
                      payment_providers:
                        type: array
  /store/shipping-options:
    get:
      operationId: listShippingOptions
      security: [{ publishableKey: [] }]
      parameters:
        - { name: cart_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shipping options for the cart
          content:
            application/json:
              schema:
                type: object
                required: [shipping_options]
                properties:
                  shipping_options:
                    type: array
  /store/customers/me:
    get:
      operationId: getCustomerMe
      security: [{ publishableKey: [] }]
      responses:
        "401":
          description: Customer session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /store/orders:
    get:
      operationId: listOrders
      security: [{ publishableKey: [] }]
      responses:
        "401":
          description: Customer session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
