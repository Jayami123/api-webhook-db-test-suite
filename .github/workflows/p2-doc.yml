# P2 documenso lane workflow (stub). Owned by the documenso lane; the only workflow file the documenso lane edits.
# Inert until the lane builds its jobs: manual trigger only, and the job is skipped (if: ${{ false }}).
# Gate when the lane goes live: `needs` cannot cross workflow files, so replace the trigger with
#   on: workflow_run: { workflows: [api], types: [completed] }
# and run the jobs only when github.event.workflow_run.conclusion == 'success' and
# github.event.workflow_run.head_repository.full_name == github.repository, checking out
# github.event.workflow_run.head_sha. The lane adds doc-serial and doc-billing-api here too.
# See docs/lane-ownership.md.
name: p2-doc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-api:
    name: doc-api
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Stub, replaced by the documenso lane job
        run: echo "stub"
